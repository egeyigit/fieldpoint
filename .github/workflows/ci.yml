name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Boot exactly the way an Atlantic Factory preview does (compose.preview.yml
      # mirrors its envelope: read-only root, cap_drop ALL, no-new-privileges,
      # init, pid limit, tmpfs for /tmp and for /data owned by uid/gid 1000
      # so the non-root node user can open the SQLite database).
      - name: Boot under the Factory preview envelope
        run: docker compose -f compose.preview.yml up -d --build
      - name: Wait for health
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -sf localhost:4100/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "health never passed"; exit 1
      - name: Assert schema is fully migrated
        run: |
          set -euo pipefail
          body=$(curl -sf localhost:4100/api/health)
          echo "$body"
          echo "$body" | grep -q '"pendingMigrations":0'
          echo "$body" | grep -q '"ok":true'
      - name: Assert the container never restarted
        run: |
          set -euo pipefail
          id=$(docker compose -f compose.preview.yml ps -q web)
          restarts=$(docker inspect -f '{{.RestartCount}}' "$id")
          echo "RestartCount=$restarts"
          test "$restarts" = "0"
      - name: Smoke test login and the qa_seed hook
        run: |
          set -euo pipefail
          curl -sf -X POST localhost:4100/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@fieldpoint.local","password":"admin-demo-pass"}' | grep -q '"role":"admin"'
          docker compose -f compose.preview.yml exec -T \
            -e FIELDPOINT_USER_EMAIL=factoryqa@example.com -e FIELDPOINT_USER_PASSWORD=factory-qa-pass-1 \
            web node scripts/create-user.js
          curl -sf -X POST localhost:4100/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"factoryqa@example.com","password":"factory-qa-pass-1"}' | grep -q '"role":"admin"'
      - name: Container logs
        if: always()
        run: docker compose -f compose.preview.yml logs --no-color web || true
