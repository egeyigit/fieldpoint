<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared collection · FieldPoint</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2322c55e'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230b0f14'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shared-page">
    <header class="shared-header">
      <div class="brand"><span class="brand-dot"></span>FieldPoint</div>
      <h1 id="shared-title">Shared collection</h1>
      <p id="shared-description" class="muted"></p>
      <p id="shared-owner" class="mono muted"></p>
      <p id="shared-error" class="error" role="alert"></p>
    </header>
    <section id="shared-content" class="shared-layout" hidden>
      <div id="shared-map" role="application" aria-label="Shared site map"></div>
      <aside class="shared-list">
        <h2>Sites</h2>
        <ul id="shared-sites" class="site-list"></ul>
      </aside>
    </section>
  </main>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/shared.js"></script>
</body>
</html>
