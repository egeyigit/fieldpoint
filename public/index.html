<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FieldPoint · Site Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2322c55e'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230b0f14'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/vendor/markercluster/MarkerCluster.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Auth screen -->
  <section id="auth-view" class="auth" hidden>
    <div class="auth-card">
      <div class="brand"><span class="brand-dot"></span>FieldPoint</div>
      <p class="muted" id="auth-subtitle">Sign in to your workspace</p>
      <form id="auth-form" autocomplete="on">
        <label id="name-field" hidden>Full name<input name="name" type="text" maxlength="80" autocomplete="name" /></label>
        <label>Email<input name="email" type="email" required autocomplete="username" /></label>
        <label>Password<input name="password" type="password" required minlength="10" autocomplete="current-password" /></label>
        <p class="error" id="auth-error" role="alert"></p>
        <button type="submit" class="primary" id="auth-submit">Sign in</button>
      </form>
    </div>
  </section>

  <!-- App shell -->
  <div id="app-view" class="shell" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>FieldPoint</div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="sites" role="tab">Sites</button>
        <button class="tab" data-tab="admin" role="tab" id="admin-tab" hidden>Admin</button>
      </nav>
      <div class="user-box">
        <span id="user-label" class="mono"></span>
        <button id="logout-btn" class="ghost">Sign out</button>
      </div>
    </header>

    <aside class="sidebar">
      <div id="panel-sites" class="panel">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search name, address, notes" aria-label="Search sites" />
          <select id="filter-category" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
          <select id="filter-status" aria-label="Filter by status">
            <option value="">All statuses</option>
          </select>
        </div>
        <div class="row between">
          <span class="muted" id="site-count">0 sites</span>
          <div class="row gap">
            <a id="export-btn" class="ghost small" href="/api/sites/export.csv">Export CSV</a>
            <button id="add-btn" class="primary small">+ Add site</button>
          </div>
        </div>
        <p class="hint">Tip: right-click the map to add a site at that point.</p>
        <ul id="site-list" class="site-list" aria-label="Site list"></ul>
      </div>

      <div id="panel-admin" class="panel" hidden>
        <h3>Users</h3>
        <form id="invite-form" class="row gap wrap">
          <input name="name" placeholder="Name" required maxlength="80" />
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Temp password (10+)" required minlength="10" />
          <button class="primary small" type="submit">Create</button>
        </form>
        <p class="error" id="admin-error" role="alert"></p>
        <table class="table" id="user-table">
          <thead><tr><th>User</th><th>Role</th><th>Active</th></tr></thead>
          <tbody></tbody>
        </table>
        <h3>Audit log</h3>
        <ul id="audit-list" class="audit"></ul>
      </div>
    </aside>

    <main id="map" role="application" aria-label="Map"></main>

    <!-- Site editor -->
    <dialog id="site-dialog">
      <form id="site-form" method="dialog">
        <h3 id="site-dialog-title">New site</h3>
        <input type="hidden" name="id" />
        <label>Name<input name="name" required maxlength="120" /></label>
        <label>Address
          <div class="row gap">
            <input name="address" maxlength="300" />
            <button type="button" id="geocode-btn" class="ghost small" title="Look up coordinates from address">Locate</button>
          </div>
        </label>
        <div class="row gap">
          <label>Latitude<input name="lat" type="number" step="any" min="-90" max="90" required /></label>
          <label>Longitude<input name="lng" type="number" step="any" min="-180" max="180" required /></label>
        </div>
        <div class="row gap">
          <label>Category<select name="category" id="form-category"></select></label>
          <label>Status<select name="status" id="form-status"></select></label>
        </div>
        <label>Notes<textarea name="notes" rows="3" maxlength="2000"></textarea></label>
        <p class="error" id="site-error" role="alert"></p>
        <div class="row between">
          <button type="button" id="delete-btn" class="danger small" hidden>Delete</button>
          <div class="row gap">
            <button type="button" id="cancel-btn" class="ghost">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </div>
      </form>
    </dialog>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/vendor/markercluster/leaflet.markercluster.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
