<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FieldPoint · Site Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2322c55e'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230b0f14'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Auth screen -->
  <section id="auth-view" class="auth" hidden>
    <div class="auth-card">
      <div class="brand"><span class="brand-dot"></span>FieldPoint</div>
      <p class="muted" id="auth-subtitle">Sign in to your workspace</p>
      <form id="auth-form" autocomplete="on">
        <label id="name-field" hidden>Full name<input name="name" type="text" maxlength="80" autocomplete="name" /></label>
        <label>Email<input name="email" type="email" required autocomplete="username" /></label>
        <label>Password<input name="password" type="password" required minlength="10" autocomplete="current-password" /></label>
        <p class="error" id="auth-error" role="alert"></p>
        <button type="submit" class="primary" id="auth-submit">Sign in</button>
      </form>
    </div>
  </section>

  <!-- App shell -->
  <div id="app-view" class="shell" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span>FieldPoint</div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="sites" role="tab" aria-selected="true">Sites</button>
        <button class="tab" data-tab="work-orders" role="tab" aria-selected="false">Work orders</button>
        <button class="tab" data-tab="admin" role="tab" aria-selected="false" id="admin-tab" hidden>Admin</button>
      </nav>
      <div class="user-box">
        <span id="user-label" class="mono"></span>
        <button id="logout-btn" class="ghost">Sign out</button>
      </div>
    </header>

    <aside class="sidebar">
      <div id="panel-sites" class="panel">
        <div id="site-stats" class="stats-strip" aria-label="Site totals by status"></div>
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search sites and work orders" aria-label="Search sites and work orders" />
          <select id="filter-category" aria-label="Filter by category"></select>
          <select id="filter-status" aria-label="Filter by status"></select>
          <select id="site-sort" aria-label="Sort sites"></select>
          <button id="near-me" class="ghost small" type="button" title="Show sites within 50 km of your location">Near me</button>
        </div>
        <div class="row gap wrap check-row">
          <label class="check"><input type="checkbox" id="filter-mine" /> Assigned to me</label>
          <label class="check" id="recycle-bin-row" hidden><input type="checkbox" id="show-deleted" /> Recycle bin</label>
        </div>
        <div class="row between">
          <span class="muted" id="site-count">0 sites</span>
          <div class="row gap">
            <a id="export-btn" class="ghost small" href="/api/sites/export.csv">Export CSV</a>
            <button id="add-btn" class="primary small">+ Add site</button>
          </div>
        </div>
        <p class="hint">Tip: right-click the map to add a site at that point.</p>
        <div id="search-results" class="search-results" aria-label="Search results" hidden></div>
        <ul id="site-list" class="site-list" aria-label="Site list"></ul>
      </div>

      <div id="panel-work-orders" class="panel" hidden>
        <div class="toolbar">
          <select id="wo-filter-status" aria-label="Filter work orders by status"></select>
          <select id="wo-filter-priority" aria-label="Filter work orders by priority"></select>
          <select id="wo-sort" aria-label="Sort work orders"></select>
        </div>
        <div class="row gap wrap check-row">
          <label class="check"><input type="checkbox" id="wo-filter-mine" /> Assigned to me</label>
          <label class="check"><input type="checkbox" id="wo-filter-open" checked /> Open only</label>
        </div>
        <div class="row between">
          <span class="muted" id="wo-count">0 work orders</span>
          <button id="wo-add" class="primary small" type="button">+ New work order</button>
        </div>
        <ul id="wo-list" class="site-list" aria-label="Work order list"></ul>
      </div>

      <div id="panel-admin" class="panel" hidden>
        <h3>Users</h3>
        <form id="invite-form" class="row gap wrap">
          <input name="name" placeholder="Name" required maxlength="80" />
          <input name="email" type="email" placeholder="Email" required />
          <input name="password" type="password" placeholder="Temp password (10+)" required minlength="10" />
          <button class="primary small" type="submit">Create</button>
        </form>
        <p class="error" id="admin-error" role="alert"></p>
        <table class="table" id="user-table">
          <thead><tr><th>User</th><th>Role</th><th>Active</th></tr></thead>
          <tbody></tbody>
        </table>
        <h3>Audit log</h3>
        <ul id="audit-list" class="audit"></ul>
      </div>
    </aside>

    <main id="map" role="application" aria-label="Map"></main>

    <!-- Site editor -->
    <dialog id="site-dialog">
      <form id="site-form" method="dialog">
        <h3 id="site-dialog-title">New site</h3>
        <input type="hidden" name="id" />
        <label>Name<input name="name" required maxlength="120" /></label>
        <label>Address
          <div class="row gap">
            <input name="address" maxlength="300" />
            <button type="button" id="geocode-btn" class="ghost small" title="Look up coordinates from address">Locate</button>
          </div>
        </label>
        <div class="row gap">
          <label>Latitude<input name="lat" type="number" step="any" min="-90" max="90" required /></label>
          <label>Longitude<input name="lng" type="number" step="any" min="-180" max="180" required /></label>
        </div>
        <div class="row gap">
          <label>Category<select name="category" id="form-category"></select></label>
          <label>Status<select name="status" id="form-status"></select></label>
        </div>
        <label>Assigned to<select name="assignedTo" id="form-assigned"></select></label>
        <label>Notes<textarea name="notes" rows="3" maxlength="2000"></textarea></label>
        <p class="muted mono" id="site-meta"></p>
        <p class="error" id="site-error" role="alert"></p>
        <div class="row between">
          <button type="button" id="delete-btn" class="danger small" hidden>Delete</button>
          <div class="row gap">
            <button type="button" id="cancel-btn" class="ghost">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </div>
      </form>
    </dialog>

    <!-- Work order editor -->
    <dialog id="wo-dialog">
      <form id="wo-form" method="dialog">
        <h3 id="wo-dialog-title">New work order</h3>
        <label>Site<select id="wo-site" required></select></label>
        <label>Title<input name="title" required maxlength="140" /></label>
        <label>Description<textarea name="description" rows="3" maxlength="4000"></textarea></label>
        <div class="row gap">
          <label>Status<select id="wo-status"></select></label>
          <label>Priority<select id="wo-priority"></select></label>
        </div>
        <div class="row gap">
          <label>Assigned to<select id="wo-assigned"></select></label>
          <label>Due date<input name="dueDate" type="date" /></label>
        </div>
        <p class="muted mono" id="wo-meta"></p>
        <p class="error" id="wo-error" role="alert"></p>
        <div class="row between">
          <button type="button" id="wo-delete" class="danger small" hidden>Delete</button>
          <div class="row gap">
            <button type="button" id="wo-cancel" class="ghost">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </div>
      </form>
      <section id="wo-comment-section" hidden>
        <h4>Activity</h4>
        <ul id="wo-comments" class="comments"></ul>
        <form id="wo-comment-form" class="row gap">
          <input name="body" placeholder="Add a note" maxlength="2000" aria-label="Add a comment" />
          <button type="submit" class="ghost small">Post</button>
        </form>
      </section>
    </dialog>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
